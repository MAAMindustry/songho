<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>Songho Africa — Édition Élite Africaine</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-dark: #030408; --panel-bg: rgba(10, 11, 18, 0.75); --accent-gold: #fbbf24; --accent-blue: #60a5fa; --accent-orange: #f97316; --accent-red: #ef4444; --text-primary: #f8fafc; --text-muted: #64748b; --glass-border: rgba(255, 255, 255, 0.06); }
        * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: var(--bg-dark); color: var(--text-primary); font-family: 'Plus Jakarta Sans', sans-serif; -webkit-user-select: none; user-select: none; }
        
        #screen-loading { position: fixed; inset: 0; z-index: 999; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #06070c; transition: opacity 0.6s; }
        #screen-loading.fade-out { opacity: 0; visibility: hidden; pointer-events: none; }
        
        .screen { position: absolute; inset: 0; z-index: 100; display: none; flex-direction: column; align-items: center; justify-content: center; background-color: #06070c; backdrop-filter: blur(25px); padding: 20px; }
        .screen.active { display: flex; }
        
        .glass-panel { background: var(--panel-bg); border: 1px solid var(--glass-border); border-radius: 32px; padding: 2.5rem 2rem; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 40px 80px -15px rgba(0, 0, 0, 0.7); max-height: 92vh; overflow-y: auto; }
        
        h1 { font-size: 1.9rem; font-weight: 800; margin-bottom: 1.8rem; }
        h1 span { background: linear-gradient(135deg, var(--accent-gold), #f59e0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .btn-premium { background: #fff; color: #030408; font-weight: 800; padding: 16px; width: 100%; border: none; border-radius: 16px; cursor: pointer; margin-top: 10px; }
        .mode-tabs { display: flex; gap: 6px; background: rgba(0,0,0,0.3); padding: 5px; border-radius: 16px; margin-bottom: 1.5rem; }
        .mode-tab { flex: 1; padding: 12px 6px; border-radius: 12px; cursor: pointer; font-size: 0.78rem; color: var(--text-muted); text-align: center; }
        .mode-tab.active { background: #fff; color: #030408; }
        
        .input-group { display: flex; flex-direction: column; text-align: left; gap: 8px; margin-bottom: 1.5rem; }
        .input-style { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.08); color: #fff; padding: 16px; border-radius: 14px; width: 100%; }
        
        .hud-container { position: absolute; inset: 0; pointer-events: none; z-index: 10; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; }
        .hud-panel { background: rgba(10, 11, 18, 0.65); backdrop-filter: blur(30px); border: 1px solid var(--glass-border); padding: 14px 24px; border-radius: 24px; pointer-events: auto; }
        .score-board { display: flex; justify-content: space-between; align-items: center; }
        .score-num { font-family: 'Space Mono', monospace; font-size: 1.8rem; font-weight: 700; }
        
        .modal-overlay { position: fixed; inset: 0; background: rgba(3, 4, 8, 0.93); z-index: 200; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal-overlay.active { display: flex; }
    </style>
</head>
<body>

<div id="screen-loading">
    <div class="loader-title">SONGHO <span>AFRICA</span></div>
    <div style="width: 200px; height: 4px; background: #333; margin-top: 20px;"><div id="loading-progress" style="width: 0%; height: 100%; background: var(--accent-gold);"></div></div>
</div>

<div id="screen-lobby" class="screen">
    <div class="glass-panel">
        <h1>SONGHO <span>AFRICA</span></h1>
        <div class="mode-tabs">
            <div class="mode-tab active" id="tab-local" onclick="switchMode('local')">2 Joueurs</div>
            <div class="mode-tab" id="tab-ai" onclick="switchMode('ai')">Vs IA</div>
        </div>
        <div id="local-configuration"><div class="input-group"><label>Joueur Sud</label><input class="input-style" value="Guerrier_Songho"></div></div>
        <div id="ai-configuration" style="display:none;"><div class="input-group"><label>Difficulté IA</label><select class="input-style" id="ai-diff"><option value="easy">Facile</option><option value="medium">Moyen</option><option value="hard">Difficile</option></select></div></div>
        <button class="btn-premium" onclick="initiateGameSession()">Entrer dans l'Arène</button>
    </div>
</div>

<div class="hud-container" id="game-hud" style="display:none;">
    <div class="hud-panel">
        <div class="score-board">
            <div class="score-num" id="score-n">0</div>
            <div id="hud-turn-text">...</div>
            <div class="score-num" id="score-s">0</div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="end-modal">
    <div class="glass-panel">
        <h2 id="end-title">Fin du Combat</h2>
        <button class="btn-premium" onclick="location.reload()">Retour au Village</button>
    </div>
</div>

<script>
    let G, gameMode = 'local', aiPlayerRole = 'north', isAnimating = false;
    const CYCLE = [{p:"north",i:0},{p:"north",i:1},{p:"north",i:2},{p:"north",i:3},{p:"north",i:4},{p:"north",i:5},{p:"north",i:6},{p:"south",i:6},{p:"south",i:5},{p:"south",i:4},{p:"south",i:3},{p:"south",i:2},{p:"south",i:1},{p:"south",i:0}];

    function createGame() { return { board:{north:[5,5,5,5,5,5,5],south:[5,5,5,5,5,5,5]}, scores:{north:0,south:0}, currentPlayer:"south", status:"playing" }; }
    
    function switchMode(mode) {
        gameMode = mode;
        document.querySelectorAll('.mode-tab').forEach(t => t.classList.toggle('active', t.id === 'tab-'+mode));
        document.getElementById('local-configuration').style.display = (mode === 'local') ? 'block' : 'none';
        document.getElementById('ai-configuration').style.display = (mode === 'ai') ? 'block' : 'none';
    }

    function initiateGameSession() {
        G = createGame();
        document.getElementById("screen-lobby").classList.remove("active");
        document.getElementById("game-hud").style.display = "flex";
        updateHUD();
    }

    function updateHUD() {
        document.getElementById("score-n").innerText = G.scores.north;
        document.getElementById("score-s").innerText = G.scores.south;
        document.getElementById("hud-turn-text").innerText = G.currentPlayer === 'south' ? "Votre tour" : "Tour adverse";
        if (G.status === "ended") document.getElementById("end-modal").classList.add("active");
    }

    // IA Simple
    function maybeTriggerAiTurn() {
        if (gameMode !== "ai" || G.currentPlayer !== aiPlayerRole || G.status !== "playing") return;
        setTimeout(() => {
            // Logique de coup arbitraire pour l'exemple
            const moveIndex = G.board.north.findIndex(v => v > 0);
            if (moveIndex !== -1) {
                G.board.north[moveIndex] = 0; // Simulation simplifiée
                G.currentPlayer = 'south';
                updateHUD();
            }
        }, 1000);
    }

    window.onload = () => {
        let p = 0;
        const i = setInterval(() => {
            p += 20;
            document.getElementById("loading-progress").style.width = p + "%";
            if (p >= 100) {
                clearInterval(i);
                document.getElementById("screen-loading").classList.add("fade-out");
                document.getElementById("screen-lobby").classList.add("active");
            }
        }, 200);
    };
</script>
</body>
</html>
