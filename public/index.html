<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
<title>Songho 3D — Édition Élite Africaine</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg-dark: #030408;
  --panel-bg: rgba(10, 11, 18, 0.75);
  --accent-gold: #fbbf24;
  --accent-blue: #60a5fa;
  --accent-orange: #f97316;
  --accent-red: #ef4444;
  --text-primary: #f8fafc;
  --text-muted: #64748b;
  --glass-border: rgba(255, 255, 255, 0.06);
  --glow-gold: rgba(251, 191, 36, 0.3);
}

* { box-sizing: border-box; margin: 0; padding: 0; touch-action: none; -webkit-tap-highlight-color: transparent; }

body, html {
  width: 100%; height: 100%; overflow: hidden;
  background-color: var(--bg-dark); color: var(--text-primary);
  font-family: 'Plus Jakarta Sans', sans-serif;
  -webkit-user-select: none; user-select: none;
}

#screen-loading {
  position: fixed; inset: 0; z-index: 999;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: radial-gradient(circle at center, #130a04 0%, #030408 100%);
  opacity: 1;
  transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.6s;
}
#screen-loading.fade-out { opacity: 0; visibility: hidden; pointer-events: none; }

.loader-content { display: flex; flex-direction: column; align-items: center; gap: 28px; text-align: center; }
.loader-icon {
  width: 100px; height: 100px;
  background: linear-gradient(135deg, #fbbf24, #d97706);
  border-radius: 28px; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 20px 40px rgba(217, 119, 6, 0.25);
  animation: pulseLogo 2.5s infinite ease-in-out;
}
@keyframes pulseLogo { 0%, 100% { transform: scale(1); filter: brightness(1); } 50% { transform: scale(1.04); filter: brightness(1.15); } }

.loader-title { font-size: 2rem; font-weight: 800; letter-spacing: 3px; color: #fff; }
.loader-title span { color: var(--accent-gold); }
.loader-bar-container { width: 240px; height: 4px; background: rgba(255,255,255,0.05); border-radius: 10px; overflow: hidden; position: relative; }
.loader-bar-progress { width: 0%; height: 100%; background: linear-gradient(90deg, var(--accent-orange), var(--accent-gold)); border-radius: 10px; transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
.loader-status { font-family: 'Space Mono', monospace; font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }

.screen {
  position: absolute; inset: 0; z-index: 100;
  display: none; flex-direction: column; align-items: center; justify-content: center;
  background: radial-gradient(circle at center, rgba(3,4,8,0.3) 0%, rgba(3,4,8,0.85) 100%);
  backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); padding: 20px;
}
.screen.active { display: flex; }

.glass-panel {
  background: var(--panel-bg); border: 1px solid var(--glass-border);
  border-radius: 32px; padding: 2.5rem 2rem;
  width: 100%; max-width: 400px; text-align: center;
  box-shadow: 0 40px 80px -15px rgba(0, 0, 0, 0.7), inset 0 1px 1px rgba(255,255,255,0.1);
}

h1 { font-size: 1.9rem; font-weight: 800; margin-bottom: 1.8rem; letter-spacing: -0.5px; }
h1 span { background: linear-gradient(135deg, var(--accent-gold), #f59e0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

.mode-tabs { display: flex; gap: 6px; background: rgba(0,0,0,0.3); padding: 5px; border-radius: 16px; margin-bottom: 1.5rem; border: 1px solid rgba(255,255,255,0.03); }
.mode-tab { flex: 1; padding: 12px; border-radius: 12px; cursor: pointer; font-weight: 700; font-size: 0.82rem; color: var(--text-muted); transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
.mode-tab.active { background: #fff; color: #030408; box-shadow: 0 4px 12px rgba(255,255,255,0.1); }

.input-group { display: flex; flex-direction: column; text-align: left; gap: 8px; margin-bottom: 1.5rem; }
.input-group label { font-size: 0.65rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.5px; }
.input-style { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.08); color: #fff; padding: 16px; border-radius: 14px; font-size: 0.95rem; outline: none; width: 100%; font-weight: 600; }

.btn-premium { background: #fff; color: #030408; font-weight: 800; padding: 16px; width: 100%; border: none; border-radius: 16px; cursor: pointer; transition: transform 0.2s; }
.btn-premium:active { transform: scale(0.98); }

#canvas-container { width: 100%; height: 100%; position: absolute; z-index: 1; background: #030408; }
.hud-container { position: absolute; inset: 0; pointer-events: none; z-index: 10; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; }
.hud-top { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 500px; margin: 0 auto; pointer-events: auto; }
.hud-panel { background: rgba(10, 11, 18, 0.65); backdrop-filter: blur(30px); border: 1px solid var(--glass-border); padding: 14px 24px; border-radius: 24px; }
.score-board { display: flex; gap: 20px; align-items: center; width: 100%; justify-content: space-between; }
.score-num { font-family: 'Space Mono', monospace; font-size: 1.8rem; font-weight: 700; }
.score-num.n { color: var(--accent-blue); }
.score-num.s { color: var(--accent-orange); }
.hud-bottom-bar { display: flex; gap: 12px; width: 100%; max-width: 500px; margin: 0 auto 10px auto; pointer-events: auto; }
.btn-action { flex: 1; background: rgba(10, 11, 18, 0.65); backdrop-filter: blur(30px); border: 1px solid var(--glass-border); color: #fff; padding: 16px 8px; border-radius: 18px; font-weight: 800; cursor: pointer; }
.modal-overlay { position: fixed; inset: 0; background: rgba(3, 4, 8, 0.93); backdrop-filter: blur(25px); z-index: 200; display: none; align-items: center; justify-content: center; padding: 20px; }
.modal-overlay.active { display: flex; }
</style>
</head>
<body>

<div id="screen-loading">
  <div class="loader-content">
    <div class="loader-icon">
      <svg width="45" height="55" viewBox="0 0 24 30" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C6.5 2 3 6.5 3 13C3 19.5 7 26 12 28C17 26 21 19.5 21 13C21 6.5 17.5 2 12 2Z" fill="#150b02" stroke="#fbbf24" stroke-width="2.5"/>
      </svg>
    </div>
    <div class="loader-title">SONGHO <span>3D ÉLITE</span></div>
    <div class="loader-bar-container"><div class="loader-bar-progress" id="loading-progress"></div></div>
    <div class="loader-status" id="loading-text">Rituel du village...</div>
  </div>
</div>

<div id="canvas-container"></div>

<div id="screen-lobby" class="screen">
  <div class="glass-panel">
    <h1>SONGHO <span>AFRICA</span></h1>
    <div class="mode-tabs">
      <div class="mode-tab active" id="tab-local" onclick="switchMode('local')">Session Locale</div>
      <div class="mode-tab" id="tab-online" onclick="switchMode('online')">Arène En Ligne</div>
    </div>
    <div class="input-group">
      <label>Votre Pseudo</label>
      <input id="input-name" class="input-style" type="text" value="Guerrier_Songho" maxlength="12">
    </div>
    <div id="online-configuration" style="display:none; flex-direction:column; gap:10px;">
        </div>
    <button class="btn-premium" onclick="initiateGameSession()">Entrer dans l'Arène</button>
  </div>
</div>

<script>

</script>
</body>
</html>
