<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
<title>Songho Africa — Édition Élite Africaine</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg-dark: #030408;
  --panel-bg: rgba(10, 11, 18, 0.75);
  --accent-gold: #fbbf24;
  --accent-blue: #60a5fa;
  --accent-orange: #f97316;
  --accent-red: #ef4444;
  --text-primary: #f8fafc;
  --text-muted: #64748b;
  --glass-border: rgba(255, 255, 255, 0.06);
  --glow-gold: rgba(251, 191, 36, 0.3);
}

/* Optimisation pour le tactile Android/iOS */
* { 
  box-sizing: border-box; 
  margin: 0; 
  padding: 0; 
  touch-action: none; 
  -webkit-tap-highlight-color: transparent; 
}

body, html {
  width: 100%; height: 100%; overflow: hidden;
  background-color: var(--bg-dark); color: var(--text-primary);
  font-family: 'Plus Jakarta Sans', sans-serif;
  -webkit-user-select: none; user-select: none;
}

/* ÉCRAN DE CHARGEMENT PREMIUM */
#screen-loading {
  position: fixed; inset: 0; z-index: 999;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background-color: #06070c;
  background-image:
    radial-gradient(circle at center, rgba(217,119,6,0.18) 0%, rgba(3,4,8,0.92) 70%),
    url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240"><g fill="none" stroke="rgba(251,191,36,0.09)" stroke-width="2"><path d="M120 10 L230 120 L120 230 L10 120 Z"/><path d="M120 50 L190 120 L120 190 L50 120 Z"/><path d="M0 0 L60 60 L0 120 M240 0 L180 60 L240 120 M0 240 L60 180 L0 120 M240 240 L180 180 L240 120" /><path d="M120 0 C 160 40, 160 80, 120 120 C 80 160, 80 200, 120 240" stroke="rgba(96,165,250,0.06)"/><path d="M0 120 C 40 160, 80 160, 120 120 C 160 80, 200 80, 240 120" stroke="rgba(96,165,250,0.06)"/></g></svg>');
  background-size: cover, 240px 240px;
  background-repeat: no-repeat, repeat;
  opacity: 1;
  transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.6s;
}
#screen-loading.fade-out {
  opacity: 0; visibility: hidden; pointer-events: none;
}

.loader-content {
  display: flex; flex-direction: column; align-items: center; gap: 28px; text-align: center;
}
.loader-icon {
  width: 100px; height: 100px;
  background: linear-gradient(135deg, #fbbf24, #d97706);
  border-radius: 28px; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 20px 40px rgba(217, 119, 6, 0.25);
  animation: pulseLogo 2.5s infinite ease-in-out;
}
@keyframes pulseLogo { 0%, 100% { transform: scale(1); filter: brightness(1); } 50% { transform: scale(1.04); filter: brightness(1.15); } }

.loader-title {
  font-size: 2rem; font-weight: 800; letter-spacing: 3px; color: #fff;
}
.loader-title span { color: var(--accent-gold); }
.loader-bar-container {
  width: 240px; height: 4px; background: rgba(255,255,255,0.05); border-radius: 10px; overflow: hidden; position: relative;
}
.loader-bar-progress {
  width: 0%; height: 100%; background: linear-gradient(90deg, var(--accent-orange), var(--accent-gold));
  border-radius: 10px; transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.loader-status { font-family: 'Space Mono', monospace; font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }

.maam-badge {
  position: absolute; bottom: 28px; left: 0; right: 0;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.78rem; font-weight: 600;
  color: #ec4899; letter-spacing: 0.3px;
}
.maam-badge strong { font-weight: 800; }

/* Écrans de menu en Glassmorphism moderne */
.screen {
  position: absolute; inset: 0; z-index: 100;
  display: none; flex-direction: column; align-items: center; justify-content: center;
  background-color: #06070c;
  background-image:
    radial-gradient(circle at center, rgba(3,4,8,0.35) 0%, rgba(3,4,8,0.88) 100%),
    url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240"><g fill="none" stroke="rgba(251,191,36,0.10)" stroke-width="2"><path d="M120 10 L230 120 L120 230 L10 120 Z"/><path d="M120 50 L190 120 L120 190 L50 120 Z"/><path d="M0 0 L60 60 L0 120 M240 0 L180 60 L240 120 M0 240 L60 180 L0 120 M240 240 L180 180 L240 120" /><path d="M120 0 C 160 40, 160 80, 120 120 C 80 160, 80 200, 120 240" stroke="rgba(96,165,250,0.07)"/><path d="M0 120 C 40 160, 80 160, 120 120 C 160 80, 200 80, 240 120" stroke="rgba(96,165,250,0.07)"/></g></svg>');
  background-size: cover, 240px 240px;
  background-repeat: no-repeat, repeat;
  backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); padding: 20px;
}
.screen.active { display: flex; }

.glass-panel {
  background: var(--panel-bg);
  border: 1px solid var(--glass-border);
  border-radius: 32px; padding: 2.5rem 2rem;
  width: 100%; max-width: 400px; text-align: center;
  box-shadow: 0 40px 80px -15px rgba(0, 0, 0, 0.7), inset 0 1px 1px rgba(255,255,255,0.1);
  position: relative;
}

h1 { font-size: 1.9rem; font-weight: 800; margin-bottom: 1.8rem; letter-spacing: -0.5px; }
h1 span { background: linear-gradient(135deg, var(--accent-gold), #f59e0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

.mode-tabs { display: flex; gap: 6px; background: rgba(0,0,0,0.3); padding: 5px; border-radius: 16px; margin-bottom: 1.5rem; border: 1px solid rgba(255,255,255,0.03); }
.mode-tab { flex: 1; padding: 12px; border-radius: 12px; cursor: pointer; font-weight: 700; font-size: 0.82rem; color: var(--text-muted); transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
.mode-tab.active { background: #fff; color: #030408; box-shadow: 0 4px 12px rgba(255,255,255,0.1); }

.input-group { display: flex; flex-direction: column; text-align: left; gap: 8px; margin-bottom: 1.5rem; }
.input-group label { font-size: 0.65rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.5px; }
.input-style {
  background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.08); color: #fff;
  padding: 16px; border-radius: 14px; font-size: 0.95rem; outline: none; width: 100%; font-weight: 600;
  transition: border-color 0.2s;
}
.input-style:focus { border-color: var(--accent-gold); }

.btn-premium {
  background: #fff; color: #030408; font-weight: 800; font-size: 0.95rem; letter-spacing: 0.3px;
  padding: 16px; width: 100%; border: none; border-radius: 16px; cursor: pointer;
  box-shadow: 0 10px 25px rgba(255,255,255,0.08);
  transition: transform 0.2s, filter 0.2s;
}
.btn-premium:active { transform: scale(0.98); }

#cultural-bg {
  position: fixed; inset: 0; z-index: 0;
  background-color: #06070c;
  background-image:
    radial-gradient(circle at 20% 25%, rgba(217,119,6,0.10) 0%, transparent 45%),
    radial-gradient(circle at 80% 75%, rgba(96,165,250,0.08) 0%, transparent 45%),
    repeating-linear-gradient(135deg, transparent 0px, transparent 78px, rgba(251,191,36,0.045) 78px, rgba(251,191,36,0.045) 80px, transparent 80px, transparent 158px, rgba(251,191,36,0.045) 158px, rgba(251,191,36,0.045) 160px),
    repeating-linear-gradient(45deg, transparent 0px, transparent 78px, rgba(96,165,250,0.03) 78px, rgba(96,165,250,0.03) 80px, transparent 80px, transparent 158px, rgba(96,165,250,0.03) 158px, rgba(96,165,250,0.03) 160px);
}
#cultural-bg::before {
  content: ""; position: absolute; inset: 0;
  background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240"><g fill="none" stroke="rgba(251,191,36,0.07)" stroke-width="2"><path d="M120 10 L230 120 L120 230 L10 120 Z"/><path d="M120 50 L190 120 L120 190 L50 120 Z"/><path d="M0 0 L60 60 L0 120 M240 0 L180 60 L240 120 M0 240 L60 180 L0 120 M240 240 L180 180 L240 120" /><path d="M120 0 C 160 40, 160 80, 120 120 C 80 160, 80 200, 120 240" stroke="rgba(96,165,250,0.05)"/><path d="M0 120 C 40 160, 80 160, 120 120 C 160 80, 200 80, 240 120" stroke="rgba(96,165,250,0.05)"/></g></svg>');
  background-repeat: repeat;
  background-size: 240px 240px;
  opacity: 0.9;
}

#canvas-container { width: 100%; height: 100%; position: absolute; z-index: 1; background: transparent; }

/* HUD DE JEU MODERNISÉ */
.hud-container {
  position: absolute; inset: 0; pointer-events: none; z-index: 10;
  display: flex; flex-direction: column; justify-content: space-between; padding: 20px;
}
.hud-top { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 500px; margin: 0 auto; pointer-events: auto; }
.hud-panel {
  background: rgba(10, 11, 18, 0.65); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
  border: 1px solid var(--glass-border); padding: 14px 24px; border-radius: 24px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.4);
}
.score-board { display: flex; gap: 20px; align-items: center; width: 100%; justify-content: space-between; }
.score-card { display: flex; flex-direction: column; }
.score-num { font-family: 'Space Mono', monospace; font-size: 1.8rem; font-weight: 700; line-height: 1.1; }
.score-num.n { color: var(--accent-blue); text-shadow: 0 0 15px rgba(96, 165, 250, 0.3); }
.score-num.s { color: var(--accent-orange); text-shadow: 0 0 15px rgba(249, 115, 22, 0.3); }

.hud-bottom-bar { display: flex; gap: 12px; width: 100%; max-width: 500px; margin: 0 auto 10px auto; pointer-events: auto; }
.btn-action {
  flex: 1; background: rgba(10, 11, 18, 0.65); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border: 1px solid var(--glass-border);
  color: var(--text-primary); padding: 16px 8px; border-radius: 18px; font-weight: 800; font-size: 0.85rem;
  cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
  box-shadow: 0 15px 35px rgba(0,0,0,0.3); transition: background 0.2s, transform 0.1s;
}
.btn-action:active { transform: scale(0.95); }
.btn-action.leave { max-width: 65px; background: rgba(239, 68, 68, 0.08); border-color: rgba(239, 68, 68, 0.15); color: var(--accent-red); }
.btn-action.audio { max-width: 65px; }

.turn-status { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 0.85rem; letter-spacing: 0.5px; text-transform: uppercase; }
.pulse-indicator { width: 8px; height: 8px; border-radius: 50%; background-color: var(--accent-gold); animation: pulseGlow 1.8s infinite ease-in-out; }
@keyframes pulseGlow { 0%, 100% { transform: scale(1); opacity: 1; box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.4); } 50% { transform: scale(1.3); opacity: 0.6; box-shadow: 0 0 12px 4px rgba(251, 191, 36, 0.4); } }

.modal-overlay {
  position: fixed; inset: 0; background: rgba(3, 4, 8, 0.93); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
  z-index: 200; display: none; align-items: center; justify-content: center; padding: 20px;
}
.modal-overlay.active { display: flex; }

/* Bannière de capture */
.capture-banner {
  position: absolute; top: 90px; left: 50%; transform: translateX(-50%) translateY(-20px) scale(0.9);
  background: linear-gradient(135deg, rgba(251,191,36,0.95), rgba(249,115,22,0.95));
  color: #1a0e02; font-weight: 800; font-size: 0.95rem; letter-spacing: 1px;
  padding: 12px 28px; border-radius: 18px; z-index: 50; pointer-events: none;
  box-shadow: 0 15px 35px rgba(251,191,36,0.35);
  opacity: 0; transition: opacity 0.35s ease, transform 0.35s ease;
  text-transform: uppercase; white-space: nowrap;
}
.capture-banner.show { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
</head>
<body>

<audio id="bg-music" loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3" type="audio/mpeg">
</audio>

<div id="screen-loading">
  <div class="loader-content">
    <div class="loader-icon">
      <svg width="45" height="55" viewBox="0 0 24 30" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C6.5 2 3 6.5 3 13C3 19.5 7 26 12 28C17 26 21 19.5 21 13C21 6.5 17.5 2 12 2Z" fill="#150b02" stroke="#fbbf24" stroke-width="2.5"/>
        <path d="M12 4V13" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
        <path d="M7 11C8.5 11 9.5 12 9.5 13.5C9.5 15 8.5 15.5 7 15.5" stroke="#f97316" stroke-width="1.5"/>
        <path d="M17 11C15.5 11 14.5 12 14.5 13.5C14.5 15 15.5 15.5 17 15.5" stroke="#f97316" stroke-width="1.5"/>
      </svg>
    </div>
    <div class="loader-title">SONGHO <span>AFRICA</span></div>
    <div class="loader-bar-container">
      <div class="loader-bar-progress" id="loading-progress"></div>
    </div>
    <div class="loader-status" id="loading-text">Rituel du village...</div>
  </div>
  <div class="maam-badge">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="12" cy="12" rx="11" ry="6.5" stroke="#ec4899" stroke-width="2"/>
      <circle cx="12" cy="12" r="3.2" fill="#ec4899"/>
    </svg>
    <span>from <strong>MAAM Industry</strong></span>
  </div>
</div>

<div id="cultural-bg"></div>
<div id="canvas-container"></div>

<div id="screen-lobby" class="screen">
  <div class="glass-panel">
    <h1>SONGHO <span>AFRICA</span></h1>
     
    <div class="mode-tabs">
      <div class="mode-tab active" id="tab-local" onclick="switchMode('local')">Session Locale</div>
      <div class="mode-tab" id="tab-online" onclick="switchMode('online')">Arène En Ligne</div>
    </div>

    <div class="input-group">
      <label>Votre Pseudo</label>
      <input id="input-name" class="input-style" type="text" value="Guerrier_Songho" maxlength="12">
    </div>

    <div id="online-configuration" style="display:none; flex-direction:column; gap:10px;">
      <div class="mode-tabs" style="margin-bottom: 0.5rem;">
        <div class="mode-tab active" id="action-create" onclick="switchOnlineAction('create')">Créer</div>
        <div class="mode-tab" id="action-join" onclick="switchOnlineAction('join')">Rejoindre</div>
      </div>
      <div class="input-group" id="code-wrapper" style="display:none;">
        <label>Code d'accès</label>
        <input id="input-code" class="input-style" type="text" placeholder="EX: AB78X" style="text-transform:uppercase; text-align:center; font-family:'Space Mono';">
      </div>
    </div>

    <button class="btn-premium" onclick="initiateGameSession()">Entrer dans l'Arène</button>
  </div>
</div>

<div id="screen-waiting" class="screen">
  <div class="glass-panel">
    <h2 style="font-size:1rem; margin-bottom:0.5rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:1px;">Clé de l'arène :</h2>
    <div id="display-code" style="font-family:'Space Mono'; font-size:2.2rem; font-weight:700; color:var(--accent-gold); letter-spacing:4px; background:rgba(0,0,0,0.3); padding:16px; border-radius:20px; margin-bottom:1.8rem; border:1px solid rgba(255,255,255,0.05)">-----</div>
    <div style="display:flex; align-items:center; justify-content:center; gap:10px; font-size:0.85rem; color:var(--text-muted)">
      <div class="pulse-indicator"></div>
      <span id="wait-status-text">Attente d'un digne adversaire...</span>
    </div>
  </div>
</div>

<div class="hud-container" id="game-hud" style="display:none;">
  <div class="hud-top">
    <div class="hud-panel">
      <div class="score-board">
        <div class="score-card">
          <span style="font-size:0.65rem; color:var(--text-muted); font-weight:800; letter-spacing: 1px;" id="tag-n">NORD</span>
          <div class="score-num n" id="score-n">0</div>
        </div>
        <div class="turn-status">
          <div class="pulse-indicator" id="turn-glow"></div>
          <span id="hud-turn-text" style="font-size:0.75rem;">...</span>
        </div>
        <div class="score-card" style="text-align:right;">
          <span style="font-size:0.65rem; color:var(--text-muted); font-weight:800; letter-spacing: 1px;" id="tag-s">SUD</span>
          <div class="score-num s" id="score-s">0</div>
        </div>
      </div>
    </div>
  </div>

  <div class="capture-banner" id="capture-banner"></div>

  <div class="hud-bottom-bar">
    <button class="btn-action leave" onclick="exitToMainMenu()">🚪</button>
    <button class="btn-action audio" id="btn-audio" onclick="toggleAudioMute()">🔊</button>
    <button class="btn-action" id="btn-undo" onclick="triggerUndoAction()" style="display:none;">↩️ Annuler</button>
    <button class="btn-action" id="btn-advice" onclick="requestStrategicAdvice()">💡 Stratégie</button>
  </div>
</div>

<div class="modal-overlay" id="end-modal">
  <div class="glass-panel" style="box-shadow: 0 0 50px rgba(251, 191, 36, 0.15); border-color: rgba(251, 191, 36, 0.2);">
    <div style="font-size:3rem; margin-bottom:0.5rem; filter: drop-shadow(0 10px 15px rgba(251,191,36,0.3));">🏆</div>
    <h2 id="end-title" style="font-size:1.6rem; margin-bottom:0.5rem;">Fin du Combat</h2>
    <p id="end-desc" style="color:var(--text-muted); font-size:0.88rem; margin-bottom:2rem; font-family:'Space Mono';"></p>
    <button class="btn-premium" onclick="location.reload()" style="background:var(--accent-gold); color:#000;">Retour au Village</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════
// GESTION MULTIMÉDIA (AUDIO)
// ═══════════════════════════════════════════════════════
const audioTrack = document.getElementById("bg-music");
let isMuted = false;

function startBackgroundMusic() {
  audioTrack.volume = 0.35;
  audioTrack.play().catch(() => console.log("Audio en attente d'interaction."));
}

function toggleAudioMute() {
  const btn = document.getElementById("btn-audio");
  isMuted = !isMuted;
  audioTrack.muted = isMuted;
  btn.innerText = isMuted ? "🔇" : "🔊";
}

// ═══════════════════════════════════════════════════════
// LOADER DE CHARGEMENT FLUIDE
// ═══════════════════════════════════════════════════════
const steps = [
  { p: 30, t: "Sculpture du banc en acajou..." },
  { p: 65, t: "Polissage des gemmes d'or..." },
  { p: 90, t: "Allumage des feux du crépuscule..." },
  { p: 100, t: "Prêt pour le combat." }
];
let currentStep = 0;

function runFakeLoader() {
  const bar = document.getElementById("loading-progress");
  const txt = document.getElementById("loading-text");
   
  const interval = setInterval(() => {
    if (currentStep < steps.length) {
      bar.style.width = steps[currentStep].p + "%";
      txt.innerText = steps[currentStep].t;
      currentStep++;
    } else {
      clearInterval(interval);
      document.getElementById("screen-loading").classList.add("fade-out");
      document.getElementById("screen-lobby").classList.add("active");
    }
  }, 300);
}
window.addEventListener('DOMContentLoaded', runFakeLoader);

// ═══════════════════════════════════════════════════════
// LOGIQUE DU JEU SONGHO
// ═══════════════════════════════════════════════════════
const CYCLE = [
  {p:"north",i:0},{p:"north",i:1},{p:"north",i:2},{p:"north",i:3},{p:"north",i:4},{p:"north",i:5},{p:"north",i:6},
  {p:"south",i:6},{p:"south",i:5},{p:"south",i:4},{p:"south",i:3},{p:"south",i:2},{p:"south",i:1},{p:"south",i:0}
];
function other(p){ return p==="north"?"south":"north"; }
function sum(a){ return a.reduce((t,v)=>t+v,0); }
function cycleIdx(pos){ return CYCLE.findIndex(c=>c.p===pos.p && c.i===pos.i); }
function createGame(){ return { board:{north:[5,5,5,5,5,5,5],south:[5,5,5,5,5,5,5]}, scores:{north:0,south:0}, currentPlayer:"south", status:"playing", winner:null }; }

let undoHistory = [];
let recommendedMove = null;

function saveStateToHistory(s) { undoHistory.push(JSON.parse(JSON.stringify(s))); }

function getLegalMoves(s) {
  const p = s.currentPlayer; const ms = [];
  for(let i=0; i<7; i++) { if(s.board[p][i] > 0) ms.push({p, i}); }
  if (sum(s.board[other(p)]) === 0) {
    return ms.filter(m => {
      const sim = JSON.parse(JSON.stringify(s));
      const seeds = sim.board[m.p][m.i]; sim.board[m.p][m.i] = 0;
      let curr = cycleIdx(m);
      for(let k=0; k<seeds; k++) { curr = (curr + 1) % 14; sim.board[CYCLE[curr].p][CYCLE[curr].i]++; }
      return sum(sim.board[other(p)]) > 0;
    });
  }
  return ms;
}

function evaluateMoveCapture(s, p, i) {
  const sim = JSON.parse(JSON.stringify(s));
  let seeds = sim.board[p][i]; sim.board[p][i] = 0;
  let curr = cycleIdx({p, i});
  let lastPos = null;
  for(let k=0; k<seeds; k++) {
    curr = (curr + 1) % 14; sim.board[CYCLE[curr].p][CYCLE[curr].i]++;
    if(k === seeds - 1) lastPos = CYCLE[curr];
  }
  let captured = 0;
  if(lastPos && lastPos.p === other(p)) {
    let pts = sim.board[lastPos.p][lastPos.i];
    if([2,3,4].includes(pts)) {
      const simBoard = [...sim.board[lastPos.p]]; simBoard[lastPos.i] = 0;
      if(sum(simBoard) > 0) captured = pts;
    }
  }
  return captured;
}

function playMove(s, p, i) {
  saveStateToHistory(s);
  recommendedMove = null;
  let seeds = s.board[p][i]; s.board[p][i] = 0;
  let curr = cycleIdx({p, i});
  let lastPos = null;
   
  for(let k=0; k<seeds; k++) {
    curr = (curr + 1) % 14; s.board[CYCLE[curr].p][CYCLE[curr].i]++;
    if(k === seeds - 1) lastPos = CYCLE[curr];
  }
   
  if(lastPos && lastPos.p === other(p)) {
    let pts = s.board[lastPos.p][lastPos.i];
    if([2,3,4].includes(pts)) {
      const simBoard = [...s.board[lastPos.p]]; simBoard[lastPos.i] = 0;
      if(sum(simBoard) > 0) { s.board[lastPos.p][lastPos.i] = 0; s.scores[p] += pts; }
    }
  }

  if(s.scores.north >= 40) { s.status="ended"; s.winner="north"; }
  else if(s.scores.south >= 40) { s.status="ended"; s.winner="south"; }
  else if(sum(s.board.north) + sum(s.board.south) < 10) {
    s.status="ended"; s.winner = s.scores.north > s.scores.south ? "north" : "south";
  } else {
    s.currentPlayer = other(s.currentPlayer);
    if(getLegalMoves(s).length === 0) { s.status="ended"; s.winner = other(s.currentPlayer); }
  }
  return true;
}

// Calcule le détail d'un coup SANS modifier l'état : utilisé pour préparer l'animation
function computeMovePlan(s, p, i) {
  const sim = JSON.parse(JSON.stringify(s));
  let seeds = sim.board[p][i]; sim.board[p][i] = 0;
  let curr = cycleIdx({p, i});
  const path = []; // liste ordonnée des fosses visitées, une entrée par graine semée
  let lastPos = null;

  for(let k=0; k<seeds; k++) {
    curr = (curr + 1) % 14;
    const pos = CYCLE[curr];
    sim.board[pos.p][pos.i]++;
    path.push({ p: pos.p, i: pos.i });
    if(k === seeds - 1) lastPos = pos;
  }

  let captureTarget = null, capturePts = 0;
  if(lastPos && lastPos.p === other(p)) {
    let pts = sim.board[lastPos.p][lastPos.i];
    if([2,3,4].includes(pts)) {
      const simBoard = [...sim.board[lastPos.p]]; simBoard[lastPos.i] = 0;
      if(sum(simBoard) > 0) { captureTarget = lastPos; capturePts = pts; }
    }
  }

  return { seedsCount: seeds, path, captureTarget, capturePts, sourcePos: {p, i} };
}

function initiateGameSession() {
  const name = document.getElementById("input-name").value.trim() || "Guerrier";
  undoHistory = []; recommendedMove = null;
  startBackgroundMusic();
   
  if(gameMode === "local") {
    playerNames = { north: "SAGE DU VILLAGE", south: name.toUpperCase() };
    G = createGame();
    initCore3DEngine();

function connectToNetworkTunnel(name) {
  // TON LIEN DE PROD SUR RENDER ENTIÈREMENT CONFIGURÉ ICI :
  const hostLocation = "songho-mlde.onrender.com"; 
  const protocol = 'wss://'; 
   
  ws = new WebSocket(protocol + hostLocation);
   
  ws.onopen = () => {
    if(onlineAction === "create") {
      ws.send(JSON.stringify({ type: 'create', name: name }));
    } else {
      const codeInput = document.getElementById("input-code").value.trim().toUpperCase();
      ws.send(JSON.stringify({ type: 'join', code: codeInput, name: name }));
    }
  };

  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
     
    if(msg.type === 'room_created') {
      roomCode = msg.code; 
      myRole = "south"; 
      document.getElementById("display-code").innerText = msg.code;
    } 
    else if(msg.type === 'room_joined') {
      roomCode = msg.code; 
      myRole = "north";
    } 
    else if(msg.type === 'game_start') {
      playerNames = msg.players; 
      G = createGame(); 
      initCore3DEngine();
      document.getElementById("screen-waiting").classList.remove("active");
      document.getElementById("game-hud").style.display = "flex";
      document.getElementById("btn-undo").style.display = "none"; 
      syncLogicTo3DVisuals();
    } 
    else if(msg.type === 'move') {
      // Si ce coup est l'écho de notre propre move déjà animé localement, on l'ignore
      if (pendingEchoSkip > 0 && msg.move.player === myRole) {
        pendingEchoSkip--;
      } else if (isAnimating) {
        // Une animation est déjà en cours : on mémorise ce coup pour le traiter juste après
        incomingMoveQueue.push(msg.move);
      } else {
        animateSowing(G, msg.move.player, msg.move.pitIndex);
      }
    } 
    else if(msg.type === 'opponent_disconnected') {
      alert("L'adversaire a fui le combat."); 
      exitToMainMenu();
    } 
    else if(msg.type === 'error') {
      alert(msg.message); 
      location.reload();
    }
  };

  ws.onerror = (err) => {
    console.error("Erreur Réseau WebSocket:", err);
    alert("Impossible de joindre le serveur. Pense à cliquer sur ton lien Render pour le réveiller s'il était éteint.");
    exitToMainMenu();
  };
}

function requestStrategicAdvice() {
  if (!G || G.status !== "playing") return;
  if (gameMode === "online" && G.currentPlayer !== myRole) return;
  const legals = getLegalMoves(G); if (legals.length === 0) return;
  let bestMove = legals[0]; let maxScore = -1;
  legals.forEach(m => {
    const scoreVal = evaluateMoveCapture(G, m.p, m.i);
    if (scoreVal > maxScore) { maxScore = scoreVal; bestMove = m; }
    else if (scoreVal === maxScore && G.board[m.p][m.i] > G.board[bestMove.p][bestMove.i]) { bestMove = m; }
  });
  recommendedMove = bestMove; syncLogicTo3DVisuals();
}

function triggerUndoAction() {
  if (undoHistory.length > 0 && G && G.status === "playing" && gameMode === "local" && !isAnimating) { 
    G = undoHistory.pop(); 
    recommendedMove = null; 
    syncLogicTo3DVisuals(); 
  }
}
function exitToMainMenu() { if (ws && ws.readyState === WebSocket.OPEN) ws.close(); location.reload(); }

// Génère une texture procédurale gravée de motifs géométriques beti
// (losanges emboîtés "ezimi", triangles opposés "etun akong", lignes sinusoïdales)
// pour orner le dessus du banc de jeu.
function createBenchTopTexture() {
  const size = 1024;
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');

  // Fond bois sombre avec léger dégradé
  const bgGrad = ctx.createLinearGradient(0, 0, size, size);
  bgGrad.addColorStop(0, '#2a160d');
  bgGrad.addColorStop(0.5, '#22120b');
  bgGrad.addColorStop(1, '#1c0f08');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, size, size);

  // Veines de bois subtiles
  ctx.strokeStyle = 'rgba(0,0,0,0.18)';
  ctx.lineWidth = 2;
  for(let y = -size; y < size * 2; y += 26) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    for(let x = 0; x <= size; x += 64) {
      ctx.lineTo(x, y + Math.sin(x * 0.01 + y * 0.05) * 10);
    }
    ctx.stroke();
  }

  const cell = size / 4; // grille 4x4 de motifs répétés

  function drawDiamondMotif(cx, cy, r) {
    // Losanges emboîtés (motif ezimi)
    ctx.strokeStyle = 'rgba(251,191,36,0.55)';
    ctx.lineWidth = 4;
    [1, 0.6].forEach((scale, idx) => {
      ctx.globalAlpha = idx === 0 ? 0.55 : 0.85;
      ctx.beginPath();
      ctx.moveTo(cx, cy - r * scale);
      ctx.lineTo(cx + r * scale, cy);
      ctx.lineTo(cx, cy + r * scale);
      ctx.lineTo(cx - r * scale, cy);
      ctx.closePath();
      ctx.stroke();
    });
    ctx.globalAlpha = 1;
  }

  function drawOpposedTriangles(cx, cy, r) {
    // Triangles opposés par leur sommet (motif etun akong)
    ctx.strokeStyle = 'rgba(96,165,250,0.35)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(cx - r, cy - r); ctx.lineTo(cx + r, cy - r); ctx.lineTo(cx, cy); ctx.closePath(); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx - r, cy + r); ctx.lineTo(cx + r, cy + r); ctx.lineTo(cx, cy); ctx.closePath(); ctx.stroke();
  }

  function drawSineCurves(x0, y0, w, h) {
    // Lignes sinusoïdales (motif caméléon) le long du bord
    ctx.strokeStyle = 'rgba(251,191,36,0.30)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    for(let x = 0; x <= w; x += 4) {
      const yy = y0 + Math.sin((x / w) * Math.PI * 2) * (h * 0.18);
      if(x === 0) ctx.moveTo(x0 + x, yy); else ctx.lineTo(x0 + x, yy);
    }
    ctx.stroke();
  }

  // Grille répétée de losanges + triangles
  for(let row = 0; row < 4; row++) {
    for(let col = 0; col < 4; col++) {
      const cx = col * cell + cell / 2;
      const cy = row * cell + cell / 2;
      drawDiamondMotif(cx, cy, cell * 0.32);
      drawOpposedTriangles(cx, cy, cell * 0.14);
    }
  }

  // Bandes sinusoïdales horizontales en haut et en bas (bordures du banc)
  drawSineCurves(0, size * 0.06, size, size * 0.06);
  drawSineCurves(0, size * 0.94, size, size * 0.06);

  // Cadre extérieur doré
  ctx.strokeStyle = 'rgba(251,191,36,0.5)';
  ctx.lineWidth = 10;
  ctx.strokeRect(20, 20, size - 40, size - 40);

  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.RepeatWrapping;
  texture.anisotropy = 4;
  return texture;
}

function createPremiumPit(player, idx, x, z) {

function pitWorldPos(player, idx, yOffset, seedIdx) {
  const mesh = pitMeshByKey[player + "_" + idx];
  const angle = (seedIdx || 0) * 1.40;
  const radius = Math.min(0.34, 0.055 * (seedIdx || 0));
  return new THREE.Vector3(
    mesh.position.x + Math.cos(angle) * radius,
    1.28 + yOffset,
    mesh.position.z + Math.sin(angle) * radius
  );
}

// ═══════════════════════════════════════════════════════
// ANIMATION DYNAMIQUE DE PARTAGE DES GRAINES (SOWING)
// ═══════════════════════════════════════════════════════
function animateSowing(s, p, i, options = {}) {
  if (isAnimating) return;
  if (!s || s.status !== "playing") return;
  // Sécurité : si le coup ne correspond plus à l'état courant (désync improbable mais possible),
  // on resynchronise simplement l'affichage sans planter.
  if (s.currentPlayer !== p || !(s.board[p][i] > 0)) {
    syncLogicTo3DVisuals();
    return;
  }
  isAnimating = true;

  if (options.skipNextEcho) {
    pendingEchoSkip++;
  }


  const plan = computeMovePlan(s, p, i);
  const sourceMesh = pitMeshByKey[p + "_" + i];
  const sourceCount = s.board[p][i];

  // Petit "tape" sur la fosse source pour signaler le départ
  new TWEEN.Tween(sourceMesh.position).to({ y: 1.12 }, 80).easing(TWEEN.Easing.Quadratic.Out)
    .yoyo(true).repeat(1).to({ y: 1.20 }, 80).start();

  const gemGeo = new THREE.DodecahedronGeometry(0.12);
  const copperMat = new THREE.MeshStandardMaterial({ color: 0x9a2212, roughness: 0.15, metalness: 0.1, emissive: 0x220502 });
  const goldMat = new THREE.MeshStandardMaterial({ color: 0xfbbf24, roughness: 0.05, metalness: 0.8, emissive: 0x442200 });
  const sourcePos3D = sourceMesh.position;

  // Compteur de graines visuel par fosse (indépendant de G, pour positionner chaque graine animée)
  const visualCounts = {};
  for(const key in pitMeshByKey) {
    const [pl, idx] = key.split("_");
    visualCounts[key] = s.board[pl][idx];
  }
  visualCounts[p + "_" + i] = 0;

  const hopDuration = 260; // durée d'un saut entre deux fosses
  const stagger = 90;      // décalage entre le départ de chaque graine
  let captureFired = false;

  // Crée et anime chaque graine voyageant le long du chemin complet (path)
  for(let k = 0; k < plan.seedsCount; k++) {
    const mat = k % 3 === 0 ? copperMat : goldMat;
    const gem = new THREE.Mesh(gemGeo, mat);
    gem.position.copy(sourcePos3D);
    gem.position.y = 1.55;
    gem.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, 0);
    seedsGroup.add(gem);

    const seedPath = plan.path.slice(0, k + 1); // une graine ne traverse que jusqu'à sa fosse d'arrivée finale, mais visuellement on ne saute que vers la fosse finale de CETTE graine
    const finalStop = plan.path[k];
    const startDelay = k * stagger;

    // Chaque graine vole directement de la fosse source vers SA fosse de destination,
    // en passant par un arc (sauts successifs visuellement groupés pour un rendu fluide et dynamique)
    setTimeout(() => {
      const destKey = finalStop.p + "_" + finalStop.i;
      const seedIdxAtDest = visualCounts[destKey];
      visualCounts[destKey] = seedIdxAtDest + 1;
      const target = pitWorldPos(finalStop.p, finalStop.i, Math.floor(seedIdxAtDest / 5) * 0.10, seedIdxAtDest);

      // Hauteur de l'arc proportionnelle à la distance pour un effet "lancer" dynamique
      const dist = sourcePos3D.distanceTo(target);
      const arcHeight = 1.1 + dist * 0.08;
      const midPoint = {
        x: (sourcePos3D.x + target.x) / 2,
        y: target.y + arcHeight,
        z: (sourcePos3D.z + target.z) / 2
      };

      // Trajectoire en deux temps : montée/translation vers le sommet de l'arc, puis chute avec rebond
      new TWEEN.Tween(gem.position)
        .to(midPoint, hopDuration * 0.55)
        .easing(TWEEN.Easing.Cubic.Out)
        .onComplete(() => {
          new TWEEN.Tween(gem.position)
            .to(target, hopDuration * 0.45)
            .easing(TWEEN.Easing.Bounce.Out)
            .start();
        })
        .start();

      // Rotation continue pendant le vol pour un effet "gemme étincelante"
      new TWEEN.Tween(gem.rotation)
        .to({ x: gem.rotation.x + Math.PI * 2, y: gem.rotation.y + Math.PI * 2 }, hopDuration)
        .start();

      // Flash bref de l'anneau de la fosse d'arrivée à l'atterrissage
      setTimeout(() => {
        const destMesh = pitMeshByKey[destKey];
        if (destMesh) {
          const ring = destMesh.userData.ringMesh;
          const baseOpacity = ring.material.opacity;
          const baseColor = ring.material.color.getHex();
          ring.material.color.setHex(0xffffff);
          ring.material.opacity = 0.9;
          new TWEEN.Tween(ring.material)
            .to({ opacity: baseOpacity }, 350)
            .easing(TWEEN.Easing.Quadratic.Out)
            .onComplete(() => ring.material.color.setHex(baseColor))
            .start();
        }
      }, hopDuration);

      // Si cette graine est la dernière du chemin et provoque une capture, déclenche l'effet capture
      if (k === plan.seedsCount - 1 && plan.captureTarget && !captureFired) {
        captureFired = true;
        setTimeout(() => triggerCaptureEffect(plan.captureTarget, plan.capturePts, s.currentPlayer === "south" ? "south" : "north"), hopDuration + 60);
      }
    }, startDelay);
  }

  // Temps total avant de finaliser l'état logique et resynchroniser la scène
  const totalDuration = (plan.seedsCount - 1) * stagger + hopDuration + 250 + (plan.captureTarget ? 500 : 0);

  setTimeout(() => {
    try {
      playMove(s, p, i);
      syncLogicTo3DVisuals();
    } catch (err) {
      console.error("Erreur lors de la finalisation du coup:", err);
    } finally {
      isAnimating = false;
      // Traite le prochain coup adverse reçu pendant cette animation, s'il y en a un
      if (incomingMoveQueue.length > 0) {
        const nextMove = incomingMoveQueue.shift();
        animateSowing(G, nextMove.player, nextMove.pitIndex);
      }
    }
  }, totalDuration);
}

function triggerCaptureEffect(target, pts, capturingPlayer) {
  const destMesh = pitMeshByKey[target.p + "_" + target.i];
  if (!destMesh) return;

  // Pulsation dorée intense de l'anneau capturé
  const ring = destMesh.userData.ringMesh;
  const baseColor = ring.material.color.getHex();
  ring.material.color.setHex(0xfbbf24);
  ring.material.opacity = 1.0;
  new TWEEN.Tween(ring.scale).to({ x: 1.35, y: 1.35, z: 1.35 }, 220).easing(TWEEN.Easing.Quadratic.Out)
    .onComplete(() => {
      new TWEEN.Tween(ring.scale).to({ x: 1.0, y: 1.0, z: 1.0 }, 280).easing(TWEEN.Easing.Elastic.Out).start();
    }).start();
  new TWEEN.Tween(ring.material).to({ opacity: 0.05 }, 600).delay(150)
    .onComplete(() => ring.material.color.setHex(baseColor)).start();

  // Petite explosion de particules dorées au-dessus de la fosse capturée
  const gemGeo = new THREE.DodecahedronGeometry(0.09);
  const goldMat = new THREE.MeshStandardMaterial({ color: 0xfbbf24, roughness: 0.05, metalness: 0.9, emissive: 0x553300 });
  const origin = pitWorldPos(target.p, target.i, 0.3, 0);

  for(let k=0; k<8; k++) {
    const particle = new THREE.Mesh(gemGeo, goldMat);
    particle.position.copy(origin);
    seedsGroup.add(particle);
    const angle = (k / 8) * Math.PI * 2;
    const radius = 0.6 + Math.random() * 0.3;
    const dest = {
      x: origin.x + Math.cos(angle) * radius,
      y: origin.y + 0.7 + Math.random() * 0.4,
      z: origin.z + Math.sin(angle) * radius
    };
    new TWEEN.Tween(particle.position).to(dest, 380).easing(TWEEN.Easing.Cubic.Out)
      .onComplete(() => {
        new TWEEN.Tween(particle.position).to({ y: particle.position.y - 1.2 }, 320).easing(TWEEN.Easing.Quadratic.In)
          .onComplete(() => seedsGroup.remove(particle)).start();
      }).start();
  }

  // Bannière "+N CAPTURÉ" en haut de l'écran
  const banner = document.getElementById("capture-banner");
  banner.innerText = `⚡ ${playerNames[capturingPlayer]} CAPTURE ${pts} GRAINES !`;
  banner.classList.add("show");
  setTimeout(() => banner.classList.remove("show"), 1300);
}

function syncLogicTo3DVisuals() {
  if(!G) return;
  document.getElementById("score-n").innerText = G.scores.north;
  document.getElementById("score-s").innerText = G.scores.south;
  document.getElementById("tag-n").innerText = playerNames.north;
  document.getElementById("tag-s").innerText = playerNames.south;
   
  const label = document.getElementById("hud-turn-text");
  const glow = document.getElementById("turn-glow");
  const adviceBtn = document.getElementById("btn-advice");
   
  adviceBtn.style.display = (gameMode === "online" && G.currentPlayer !== myRole) || G.status !== "playing" ? "none" : "flex";

  if(G.status === "ended") {
    label.innerText = "Combat Clos"; glow.style.backgroundColor = "var(--accent-gold)";
    document.getElementById("end-title").innerText = `Victoire de ${playerNames[G.winner]}`;
    document.getElementById("end-desc").innerText = `SCORE FINAL — ${G.scores.north} VS ${G.scores.south}`;
    document.getElementById("end-modal").classList.add("active");
  } else {
    if(gameMode === "online") {
      label.innerText = G.currentPlayer === myRole ? "À ton tour !" : "L'adversaire réfléchit...";
    } else {
      label.innerText = G.currentPlayer === "south" ? "Tour : Sud" : "Tour : Nord";
    }
    glow.style.backgroundColor = G.currentPlayer === "south" ? "var(--accent-orange)" : "var(--accent-blue)";
  }

  while(seedsGroup.children.length > 0) { seedsGroup.remove(seedsGroup.children[0]); }

  const gemGeo = new THREE.DodecahedronGeometry(0.12);
  const copperMat = new THREE.MeshStandardMaterial({ color: 0x9a2212, roughness: 0.15, metalness: 0.1, emissive: 0x220502 });
  const goldMat = new THREE.MeshStandardMaterial({ color: 0xfbbf24, roughness: 0.05, metalness: 0.8, emissive: 0x442200 });
  const legals = getLegalMoves(G);

  pits3D.forEach(pit => {
    const { player, index, ringMesh } = pit.userData;
    const count = G.board[player][index];
    const isRecommended = recommendedMove && recommendedMove.p === player && recommendedMove.i === index;
    const isPlayable = legals.some(m => m.p === player && m.i === index) && G.status === "playing";
     
    if (isRecommended) {
      ringMesh.material.color.setHex(0xfbbf24); ringMesh.material.opacity = 1.0; ringMesh.scale.setScalar(1.06);
    } else if (isPlayable && (gameMode === "local" || G.currentPlayer === myRole)) {
      ringMesh.material.color.setHex(player === "north" ? 0x60a5fa : 0xf97316); ringMesh.material.opacity = 0.5; ringMesh.scale.setScalar(1.02);
    } else {
      ringMesh.material.color.setHex(player === "north" ? 0x60a5fa : 0xf97316); ringMesh.material.opacity = 0.05; ringMesh.scale.setScalar(1.0);
    }

    for(let k=0; k<count; k++) {
      const gemMesh = new THREE.Mesh(gemGeo, k % 3 === 0 ? copperMat : goldMat);
      const angle = k * 1.40; const radius = Math.min(0.34, 0.055 * k);
      const targetY = 1.28 + (Math.floor(k / 5) * 0.10);
       
      gemMesh.position.set(
        pit.position.x + Math.cos(angle) * radius,
        targetY + 2.0,
        pit.position.z + Math.sin(angle) * radius
      );
       
      new TWEEN.Tween(gemMesh.position).to({ y: targetY }, 350 + (k*15)).easing(TWEEN.Easing.Bounce.Out).start();
      gemMesh.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, 0);
      seedsGroup.add(gemMesh);
    }
  });
}

function handleAndroidTouchClick(e) {
  if(!G || G.status !== "playing" || isAnimating) return;
  if(gameMode === "online" && G.currentPlayer !== myRole) return; 
  if (Date.now() - pointerStartTime > 200) return;

  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);

  const intersects = raycaster.intersectObjects(pits3D);
  if(intersects.length > 0) {
    const { player, index } = intersects[0].object.userData;
    if(player === G.currentPlayer && getLegalMoves(G).some(m => m.p === player && m.i === index)) {

      const isOnlineSend = gameMode === "online" && ws && ws.readyState === WebSocket.OPEN;
      if(isOnlineSend) {
        ws.send(JSON.stringify({ type: 'move', code: roomCode, move: { player, pitIndex: index } }));
      }

      animateSowing(G, player, index, { skipNextEcho: isOnlineSend });
    }
  }
}

function animateFrameLoop() {
  requestAnimationFrame(animateFrameLoop); TWEEN.update(); controls.update();
   
  if(G && G.status === "playing") {
    const time = Date.now() * 0.004;
    pits3D.forEach(pit => {
      if (recommendedMove && recommendedMove.p === pit.userData.player && recommendedMove.i === pit.userData.index) {
        pit.userData.ringMesh.material.opacity = 0.5 + Math.sin(time * 3) * 0.5;
      }
    });
  }
  renderer.render(scene, camera);
}

function handleResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  const isMobile = window.innerWidth < 768;
  if(isMobile) camera.position.set(0, 14, 5.0);
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}
</script>
