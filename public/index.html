<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
<title>Songo 3D — Android Élite</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg-dark: #05070f;
  --panel-bg: rgba(9, 11, 23, 0.88);
  --accent-gold: #f59e0b;
  --accent-blue: #3b82f6;
  --accent-orange: #f97316;
  --accent-red: #ef4444;
  --text-primary: #f8fafc;
  --text-muted: #94a3b8;
  --glass-border: rgba(255, 255, 255, 0.08);
}

/* Optimisation pour le tactile Android */
* { 
  box-sizing: border-box; 
  margin: 0; 
  padding: 0; 
  touch-action: none; /* Désactive les gestes par défaut du navigateur pour laisser la main à la 3D */
  -webkit-tap-highlight-color: transparent; 
}

body, html {
  width: 100%; height: 100%; overflow: hidden;
  background-color: var(--bg-dark); color: var(--text-primary);
  font-family: 'Plus Jakarta Sans', sans-serif;
  -webkit-user-select: none; user-select: none;
}

.screen {
  position: absolute; inset: 0; z-index: 100;
  display: none; flex-direction: column; align-items: center; justify-content: center;
  background: radial-gradient(circle at center, rgba(5,7,15,0.6) 0%, rgba(5,7,15,0.99) 100%);
  backdrop-filter: blur(20px); padding: 15px;
}
.screen.active { display: flex; }

.glass-panel {
  background: var(--panel-bg);
  border: 1px solid var(--glass-border);
  border-radius: 24px; padding: 2rem 1.5rem;
  width: 100%; max-width: 400px; text-align: center;
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
}

h1 { font-size: 1.6rem; font-weight: 800; margin-bottom: 1.5rem; letter-spacing: -0.5px; }
h1 span { background: linear-gradient(135deg, var(--accent-gold), #f97316); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

.mode-tabs { display: flex; gap: 8px; background: rgba(0,0,0,0.5); padding: 4px; border-radius: 12px; margin-bottom: 1.25rem; }
.mode-tab { flex: 1; padding: 10px; border-radius: 9px; cursor: pointer; font-weight: 600; font-size: 0.85rem; color: var(--text-muted); }
.mode-tab.active { background: rgba(255,255,255,0.1); color: #fff; }

.input-group { display: flex; flex-direction: column; text-align: left; gap: 6px; margin-bottom: 1.25rem; }
.input-group label { font-size: 0.7rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
.input-style {
  background: rgba(0,0,0,0.5); border: 1px solid var(--glass-border); color: #fff;
  padding: 12px 16px; border-radius: 12px; font-size: 1rem; outline: none; width: 100%;
}

.btn-premium {
  background: linear-gradient(135deg, var(--accent-gold), #d97706);
  color: #05070f; font-weight: 700; font-size: 1rem;
  padding: 14px; width: 100%; border: none; border-radius: 14px; cursor: pointer;
}

#canvas-container { width: 100%; height: 100%; position: absolute; z-index: 1; }

.hud-container {
  position: absolute; inset: 0; pointer-events: none; z-index: 10;
  display: flex; flex-direction: column; justify-content: space-between; padding: 12px;
}

.hud-top { display: flex; flex-direction: column; gap: 8px; width: 100%; pointer-events: auto; }
.hud-panel {
  background: rgba(9, 11, 23, 0.85); backdrop-filter: blur(15px);
  border: 1px solid var(--glass-border); padding: 10px 16px; border-radius: 16px;
  display: flex; justify-content: space-between; align-items: center;
}

.score-board { display: flex; gap: 20px; align-items: center; width: 100%; justify-content: space-between; }
.score-card { display: flex; flex-direction: column; }
.score-num { font-family: 'Space Mono', monospace; font-size: 1.4rem; font-weight: 700; }
.score-num.n { color: var(--accent-blue); }
.score-num.s { color: var(--accent-orange); }

.hud-bottom-bar { display: flex; gap: 8px; width: 100%; pointer-events: auto; margin-bottom: 5px; }
.btn-action {
  flex: 1; background: rgba(9, 11, 23, 0.85); backdrop-filter: blur(15px); border: 1px solid var(--glass-border);
  color: var(--text-primary); padding: 14px 8px; border-radius: 14px; font-weight: 700; font-size: 0.85rem;
  cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px;
}
.btn-action.leave { max-width: 60px; background: rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.3); }

.turn-status { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 0.8rem; }
.pulse-indicator { width: 8px; height: 8px; border-radius: 50%; background-color: var(--accent-gold); animation: pulseGlow 1.5s infinite; }
@keyframes pulseGlow { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.3); opacity: 0.4; } }

.modal-overlay {
  position: fixed; inset: 0; background: rgba(3, 5, 12, 0.95); backdrop-filter: blur(15px);
  z-index: 200; display: none; align-items: center; justify-content: center; padding: 15px;
}
.modal-overlay.active { display: flex; }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
</head>
<body>

<div id="canvas-container"></div>

<div id="screen-lobby" class="screen active">
  <div class="glass-panel">
    <h1>SONGO <span>ANDROID 3D</span></h1>
    
    <div class="mode-tabs">
      <div class="mode-tab active" id="tab-local" onclick="switchMode('local')">Session Locale</div>
      <div class="mode-tab" id="tab-online" onclick="switchMode('online')">Arène En Ligne</div>
    </div>

    <div class="input-group">
      <label>Votre Pseudo</label>
      <input id="input-name" class="input-style" type="text" value="Android_Player" maxlength="12">
    </div>

    <div id="online-configuration" style="display:none; flex-direction:column; gap:10px;">
      <div class="mode-tabs" style="margin-bottom: 0.5rem;">
        <div class="mode-tab active" id="action-create" onclick="switchOnlineAction('create')">Créer</div>
        <div class="mode-tab" id="action-join" onclick="switchOnlineAction('join')">Rejoindre</div>
      </div>
      <div class="input-group" id="code-wrapper" style="display:none;">
        <label>Code d'accès</label>
        <input id="input-code" class="input-style" type="text" placeholder="EX: AB78X" style="text-transform:uppercase; text-align:center; font-family:'Space Mono';">
      </div>
    </div>

    <button class="btn-premium" onclick="initiateGameSession()">Ouvrir l'Arène</button>
  </div>
</div>

<div id="screen-waiting" class="screen">
  <div class="glass-panel">
    <h2 style="font-size:1.2rem; margin-bottom:0.5rem;">Clé de connexion :</h2>
    <div id="display-code" style="font-family:'Space Mono'; font-size:2rem; font-weight:700; color:var(--accent-gold); letter-spacing:4px; background:rgba(0,0,0,0.4); padding:12px; border-radius:14px; margin-bottom:1.5rem;">-----</div>
    <div style="display:flex; align-items:center; justify-content:center; gap:8px; font-size:0.85rem; color:var(--text-muted)">
      <div class="pulse-indicator"></div>
      <span id="wait-status-text">Attente du joueur...</span>
    </div>
  </div>
</div>

<div class="hud-container" id="game-hud" style="display:none;">
  <div class="hud-top">
    <div class="hud-panel">
      <div class="score-board">
        <div class="score-card">
          <span style="font-size:0.65rem; color:var(--text-muted); font-weight:700;" id="tag-n">NORD</span>
          <div class="score-num n" id="score-n">0</div>
        </div>
        <div class="turn-status">
          <div class="pulse-indicator" id="turn-glow"></div>
          <span id="hud-turn-text" style="font-size:0.75rem;">...</span>
        </div>
        <div class="score-card" style="text-align:right;">
          <span style="font-size:0.65rem; color:var(--text-muted); font-weight:700;" id="tag-s">SUD</span>
          <div class="score-num s" id="score-s">0</div>
        </div>
      </div>
    </div>
  </div>

  <div class="hud-bottom-bar">
    <button class="btn-action leave" onclick="exitToMainMenu()">🚪</button>
    <button class="btn-action" id="btn-undo" onclick="triggerUndoAction()" style="display:none;">↩️ Retour</button>
    <button class="btn-action" id="btn-advice" onclick="requestStrategicAdvice()">💡 Conseil</button>
  </div>
</div>

<div class="modal-overlay" id="end-modal">
  <div class="glass-panel">
    <div style="font-size:2.5rem; margin-bottom:0.5rem;">🏆</div>
    <h2 id="end-title" style="font-size:1.4rem; margin-bottom:0.5rem;">Fin de Partie</h2>
    <p id="end-desc" style="color:var(--text-muted); font-size:0.85rem; margin-bottom:1.5rem;"></p>
    <button class="btn-premium" onclick="location.reload()">Menu Principal</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════
// NOUVEAU LOGICIEL DE JEU SONGO CONFORME AUX RÈGLES OFFICIELLES
// ═══════════════════════════════════════════════════════
const CYCLE = [
  {p:"north",i:0},{p:"north",i:1},{p:"north",i:2},{p:"north",i:3},{p:"north",i:4},{p:"north",i:5},{p:"north",i:6},
  {p:"south",i:6},{p:"south",i:5},{p:"south",i:4},{p:"south",i:3},{p:"south",i:2},{p:"south",i:1},{p:"south",i:0}
];
function other(p){ return p==="north"?"south":"north"; }
function sum(a){ return a.reduce((t,v)=>t+v,0); }
function cycleIdx(pos){ return CYCLE.findIndex(c=>c.p===pos.p && c.i===pos.i); }
function createGame(){ return { board:{north:[5,5,5,5,5,5,5],south:[5,5,5,5,5,5,5]}, scores:{north:0,south:0}, currentPlayer:"south", status:"playing", winner:null }; }

let undoHistory = [];
let recommendedMove = null;

function saveStateToHistory(s) { undoHistory.push(JSON.parse(JSON.stringify(s))); }

function getLegalMoves(s) {
  const p = s.currentPlayer; const ms = [];
  for(let i=0; i<7; i++) { if(s.board[p][i] > 0) ms.push({p, i}); }
  if (sum(s.board[other(p)]) === 0) {
    return ms.filter(m => {
      const sim = JSON.parse(JSON.stringify(s));
      const seeds = sim.board[m.p][m.i]; sim.board[m.p][m.i] = 0;
      let curr = cycleIdx(m);
      for(let k=0; k<seeds; k++) { curr = (curr + 1) % 14; sim.board[CYCLE[curr].p][CYCLE[curr].i]++; }
      return sum(sim.board[other(p)]) > 0;
    });
  }
  return ms;
}

function evaluateMoveCapture(s, p, i) {
  const sim = JSON.parse(JSON.stringify(s));
  let seeds = sim.board[p][i]; sim.board[p][i] = 0;
  let curr = cycleIdx({p, i});
  let lastPos = null;
  for(let k=0; k<seeds; k++) {
    curr = (curr + 1) % 14; sim.board[CYCLE[curr].p][CYCLE[curr].i]++;
    if(k === seeds - 1) lastPos = CYCLE[curr];
  }
  let captured = 0;
  if(lastPos && lastPos.p === other(p)) {
    let pts = sim.board[lastPos.p][lastPos.i];
    if([2,3,4].includes(pts)) {
      const simBoard = [...sim.board[lastPos.p]]; simBoard[lastPos.i] = 0;
      if(sum(simBoard) > 0) captured = pts;
    }
  }
  return captured;
}

function playMove(s, p, i) {
  saveStateToHistory(s);
  recommendedMove = null;
  let seeds = s.board[p][i]; s.board[p][i] = 0;
  let curr = cycleIdx({p, i});
  let lastPos = null;
  
  for(let k=0; k<seeds; k++) {
    curr = (curr + 1) % 14; s.board[CYCLE[curr].p][CYCLE[curr].i]++;
    if(k === seeds - 1) lastPos = CYCLE[curr];
  }
  
  if(lastPos && lastPos.p === other(p)) {
    let pts = s.board[lastPos.p][lastPos.i];
    if([2,3,4].includes(pts)) {
      const simBoard = [...s.board[lastPos.p]]; simBoard[lastPos.i] = 0;
      if(sum(simBoard) > 0) { s.board[lastPos.p][lastPos.i] = 0; s.scores[p] += pts; }
    }
  }

  if(s.scores.north >= 40) { s.status="ended"; s.winner="north"; }
  else if(s.scores.south >= 40) { s.status="ended"; s.winner="south"; }
  else if(sum(s.board.north) + sum(s.board.south) < 10) {
    s.status="ended"; s.winner = s.scores.north > s.scores.south ? "north" : "south";
  } else {
    s.currentPlayer = other(s.currentPlayer);
    if(getLegalMoves(s).length === 0) { s.status="ended"; s.winner = other(s.currentPlayer); }
  }
  return true;
}

// ═══════════════════════════════════════════════════════
// GESTION RÉSEAU ET ROUTAGE MOBILE
// ═══════════════════════════════════════════════════════
let gameMode = "local"; let onlineAction = "create";
let G = null; let myRole = "south"; let roomCode = null; let ws = null;
let playerNames = { north: "Nord", south: "Sud" };

function switchMode(m) {
  gameMode = m;
  document.getElementById("tab-local").classList.toggle("active", m==="local");
  document.getElementById("tab-online").classList.toggle("active", m==="online");
  document.getElementById("online-configuration").style.display = m==="online" ? "flex" : "none";
}
function switchOnlineAction(a) {
  onlineAction = a;
  document.getElementById("action-create").classList.toggle("active", a==="create");
  document.getElementById("action-join").classList.toggle("active", a==="join");
  document.getElementById("code-wrapper").style.display = a==="join" ? "flex" : "none";
}

function initiateGameSession() {
  const name = document.getElementById("input-name").value.trim() || "Android";
  undoHistory = []; recommendedMove = null;
  
  if(gameMode === "local") {
    playerNames = { north: "Joueur 2", south: name };
    G = createGame();
    initCore3DEngine();
    document.getElementById("screen-lobby").classList.remove("active");
    document.getElementById("game-hud").style.display = "flex";
    document.getElementById("btn-undo").style.display = "flex"; 
    syncLogicTo3DVisuals();
  } else {
    document.getElementById("screen-lobby").classList.remove("active");
    document.getElementById("screen-waiting").classList.add("active");
    connectToNetworkTunnel(name);
  }
}

function connectToNetworkTunnel(name) {
  // Adaptation de l'adresse WebSocket sécurisée absolue pour Android
  const hostLocation = window.location.host;
  const protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
  ws = new WebSocket(protocol + hostLocation);
  
  ws.onopen = () => {
    if(onlineAction === "create") ws.send(JSON.stringify({ type: 'create', name: name }));
    else ws.send(JSON.stringify({ type: 'join', code: document.getElementById("input-code").value.trim().toUpperCase(), name: name }));
  };
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if(msg.type === 'room_created') {
      roomCode = msg.code; myRole = "south"; document.getElementById("display-code").innerText = msg.code;
    } else if(msg.type === 'room_joined') {
      roomCode = msg.code; myRole = "north";
    } else if(msg.type === 'game_start') {
      playerNames = msg.players; G = createGame(); initCore3DEngine();
      document.getElementById("screen-waiting").classList.remove("active");
      document.getElementById("game-hud").style.display = "flex";
      document.getElementById("btn-undo").style.display = "none";
      syncLogicTo3DVisuals();
    } else if(msg.type === 'move') {
      playMove(G, msg.move.player, msg.move.pitIndex); syncLogicTo3DVisuals();
    } else if(msg.type === 'opponent_disconnected') {
      alert("Adversaire déconnecté."); exitToMainMenu();
    } else if(msg.type === 'error') {
      alert(msg.message); location.reload();
    }
  };
}

function requestStrategicAdvice() {
  if (!G || G.status !== "playing") return;
  if (gameMode === "online" && G.currentPlayer !== myRole) return;
  const legals = getLegalMoves(G); if (legals.length === 0) return;
  let bestMove = legals[0]; let maxScore = -1;
  legals.forEach(m => {
    const scoreVal = evaluateMoveCapture(G, m.p, m.i);
    if (scoreVal > maxScore) { maxScore = scoreVal; bestMove = m; }
    else if (scoreVal === maxScore && G.board[m.p][m.i] > G.board[bestMove.p][bestMove.i]) { bestMove = m; }
  });
  recommendedMove = bestMove; syncLogicTo3DVisuals();
}

function triggerUndoAction() {
  if (undoHistory.length > 0 && G && G.status === "playing") { G = undoHistory.pop(); recommendedMove = null; syncLogicTo3DVisuals(); }
}
function exitToMainMenu() { if (ws && ws.readyState === WebSocket.OPEN) ws.close(); location.reload(); }

// ═══════════════════════════════════════════════════════
// MOTEUR GRAPHIOUE 3D STABILISÉ POUR ANDROID
// ═══════════════════════════════════════════════════════
let scene, camera, renderer, controls, pits3D = [], seedsGroup;
let raycaster = new THREE.Raycaster(); let mouse = new THREE.Vector2();
let pointerStartTime = 0; // Distingue le tap du glissement de caméra

function initCore3DEngine() {
  const container = document.getElementById("canvas-container");
  container.innerHTML = ""; pits3D = [];
  scene = new THREE.Scene(); scene.fog = new THREE.FogExp2(0x05070f, 0.02);

  camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
  
  // Vue orthographique adaptative optimisée pour écran vertical Android
  const isMobile = window.innerWidth < 768;
  if(isMobile) {
    camera.position.set(0, 15, 4.5);
  } else {
    camera.position.set(0, 11, 12);
  }

  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); // Limite à 1.5 pour éviter la surchauffe Android
  renderer.shadowMap.enabled = false; // Désactivé sur mobile pour garantir 60 FPS constants
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  container.appendChild(renderer.domElement);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; 
  controls.dampingFactor = 0.08;
  controls.maxPolarAngle = Math.PI / 2.2;
  controls.minDistance = 5; 
  controls.maxDistance = 22;
  controls.enablePan = false; // Empeche l'écran de se décaler en dehors du cadre en glissant à deux doigts

  if(isMobile) {
    controls.rotateSpeed = 0.45;
  }

  const ambientLight = new THREE.AmbientLight(0x22314d, 1.2); scene.add(ambientLight);
  const sunLight = new THREE.DirectionalLight(0xfffbeb, 0.8); sunLight.position.set(2, 12, 2); scene.add(sunLight);

  // Structure du Banc en bois
  const benchGroup = new THREE.Group();
  const woodMaterial = new THREE.MeshStandardMaterial({ color: 0x331c10, roughness: 0.4, metalness: 0.1 });
  
  const topMesh = new THREE.Mesh(new THREE.BoxGeometry(16.2, 0.5, 4.8), woodMaterial); topMesh.position.y = 1.0; benchGroup.add(topMesh);
  const leftLeg = new THREE.Mesh(new THREE.BoxGeometry(0.7, 1.0, 4.4), woodMaterial); leftLeg.position.set(-7.3, 0.5, 0); benchGroup.add(leftLeg);
  const rightLeg = leftLeg.clone(); rightLeg.position.x = 7.3; benchGroup.add(rightLeg);
  scene.add(benchGroup);

  seedsGroup = new THREE.Group(); scene.add(seedsGroup);

  // Positionnement des cavités
  for(let i=0; i<7; i++) createPremiumPit("north", i, -5.25 + (i * 1.75), -1.1);
  for(let i=0; i<7; i++) createPremiumPit("south", i, -5.25 + (i * 1.75), 1.1);

  // ÉVÉNEMENTS SPÉCIFIQUES TACTILES ANDROID UNIFIÉS
  window.addEventListener('pointerdown', () => { pointerStartTime = Date.now(); });
  window.addEventListener('pointerup', handleAndroidTouchClick);
  window.addEventListener('resize', handleResize);
  
  animateFrameLoop();
}

function createPremiumPit(player, idx, x, z) {
  // Rayon élargi à 0.78 pour une tolérance parfaite aux gros doigts sur mobile
  const pitGeo = new THREE.CylinderGeometry(0.78, 0.62, 0.12, 20);
  const pitMat = new THREE.MeshStandardMaterial({ 
    color: 0x140c06, roughness: 0.5,
    emissive: player === "north" ? 0x1d4ed8 : 0xb45309, emissiveIntensity: 0.08
  });
  const mesh = new THREE.Mesh(pitGeo, pitMat); mesh.position.set(x, 1.21, z); scene.add(mesh);
  
  const ringGeo = new THREE.RingGeometry(0.78, 0.82, 20);
  const ringMat = new THREE.MeshBasicMaterial({ color: player === "north" ? 0x3b82f6 : 0xf97316, side: THREE.DoubleSide, transparent: true, opacity: 0.2 });
  const ring = new THREE.Mesh(ringGeo, ringMat); ring.rotation.x = Math.PI / 2; ring.position.set(x, 1.27, z); scene.add(ring);

  mesh.userData = { player, index: idx, ringMesh: ring }; pits3D.push(mesh);
}

function syncLogicTo3DVisuals() {
  if(!G) return;
  document.getElementById("score-n").innerText = G.scores.north;
  document.getElementById("score-s").innerText = G.scores.south;
  document.getElementById("tag-n").innerText = playerNames.north.substring(0, 10);
  document.getElementById("tag-s").innerText = playerNames.south.substring(0, 10);
  
  const label = document.getElementById("hud-turn-text");
  const glow = document.getElementById("turn-glow");
  const adviceBtn = document.getElementById("btn-advice");
  
  adviceBtn.style.display = (gameMode === "online" && G.currentPlayer !== myRole) || G.status !== "playing" ? "none" : "flex";

  if(G.status === "ended") {
    label.innerText = "Fini"; glow.style.backgroundColor = "var(--accent-gold)";
    document.getElementById("end-title").innerText = `Victoire : ${playerNames[G.winner]}`;
    document.getElementById("end-desc").innerText = `Score — N : ${G.scores.north} | S : ${G.scores.south}`;
    document.getElementById("end-modal").classList.add("active");
  } else {
    label.innerText = G.currentPlayer === "south" ? "Tour : Sud" : "Tour : Nord";
    glow.style.backgroundColor = G.currentPlayer === "south" ? "var(--accent-orange)" : "var(--accent-blue)";
  }

  while(seedsGroup.children.length > 0) { seedsGroup.remove(seedsGroup.children[0]); }

  const gemGeo = new THREE.DodecahedronGeometry(0.12);
  const copperMat = new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.3 });
  const goldMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b, roughness: 0.3 });
  const legals = getLegalMoves(G);

  pits3D.forEach(pit => {
    const { player, index, ringMesh } = pit.userData;
    const count = G.board[player][index];
    const isRecommended = recommendedMove && recommendedMove.p === player && recommendedMove.i === index;
    const isPlayable = legals.some(m => m.p === player && m.i === index) && G.status === "playing";
    
    if (isRecommended) {
      ringMesh.material.color.setHex(0xf59e0b); ringMesh.material.opacity = 0.95; ringMesh.scale.setScalar(1.08);
    } else if (isPlayable && (gameMode === "local" || G.currentPlayer === myRole)) {
      ringMesh.material.color.setHex(player === "north" ? 0x3b82f6 : 0xf97316); ringMesh.material.opacity = 0.6; ringMesh.scale.setScalar(1.04);
    } else {
      ringMesh.material.color.setHex(player === "north" ? 0x3b82f6 : 0xf97316); ringMesh.material.opacity = 0.12; ringMesh.scale.setScalar(1.0);
    }

    // Algorithme d'empilement stable
    for(let k=0; k<count; k++) {
      const gemMesh = new THREE.Mesh(gemGeo, k % 2 === 0 ? copperMat : goldMat);
      const angle = k * 1.25; const radius = Math.min(0.35, 0.06 * k);
      gemMesh.position.set(pit.position.x + Math.cos(angle)*radius, 1.28 + (Math.floor(k / 5)*0.11), pit.position.z + Math.sin(angle)*radius);
      seedsGroup.add(gemMesh);
    }
  });
}

function handleAndroidTouchClick(e) {
  if(!G || G.status !== "playing") return;
  if(gameMode === "online" && G.currentPlayer !== myRole) return;

  // Si l'utilisateur est resté appuyé plus de 250ms, c'est qu'il glissait la caméra, on ignore le clic !
  if (Date.now() - pointerStartTime > 250) return;

  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);

  const intersects = raycaster.intersectObjects(pits3D);
  if(intersects.length > 0) {
    const { player, index } = intersects[0].object.userData;
    if(player === G.currentPlayer && getLegalMoves(G).some(m => m.p === player && m.i === index)) {
      new TWEEN.Tween(intersects[0].object.position).to({ y: 1.15 }, 80).yoyo(true).repeat(1).to({ y: 1.21 }, 80).start();
      playMove(G, player, index); syncLogicTo3DVisuals();
      if(gameMode === "online" && ws) ws.send(JSON.stringify({ type: 'move', code: roomCode, move: { player, pitIndex: index } }));
    }
  }
}

function animateFrameLoop() {
  requestAnimationFrame(animateFrameLoop); TWEEN.update(); controls.update();
  if(G && G.status === "playing") {
    pits3D.forEach(pit => {
      if (recommendedMove && recommendedMove.p === pit.userData.player && recommendedMove.i === pit.userData.index) {
        pit.userData.ringMesh.material.opacity = 0.5 + Math.sin(Date.now() * 0.015) * 0.4;
      }
    });
  }
  renderer.render(scene, camera);
}

function handleResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  const isMobile = window.innerWidth < 768;
  if(isMobile) camera.position.set(0, 15, 4.5);
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}
</script>
